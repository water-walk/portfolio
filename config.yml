baseURL: "https://water-walk.github.io/portfolio/"
title: "ASLEBEN | Portfolio"
theme: ["hugo-PaperMod"]

enableEmoji: true
minify:
  disableXML: true
  minifyOutput: true

#言語設定
languages:
  en:
    languageName: "JP"
    weight: 1
    menu:
      main:
        - name: "UPDATE"
          url: "#updates"
          weight: 10
        - name: "WORK"
          url: "#work"
          weight: 20
        - name: "ABOUT"
          url: "#about"
          weight: 30
        - name: "CONTACT"
          url: "#contact"
          weight: 40


#設定
params:
  env: production
  description: "ASLEBEN Portfolio Site"
  author: "Your Name"

  # 見た目
  defaultTheme: light      # 背景
  disableThemeToggle: true # ダークモード切替を隠す
  
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true

  #トップ画面
  profileMode:
    enabled: true
    title: "Hasuda's portfolio"      # 中央に大きく出るロゴ・名前
    subtitle: "Creative Technologist / Engineer"
    # imageUrl: "images/logo.png" # ロゴ画像を入れる場合はここを解除
    imageWidth: 200
    imageHeight: 200
    buttons:
      - name: "View Works"
        url: "#work"

  #SNSアイコン
  socialIcons:
    - name: github
      url: "https://github.com/water-walk"

  
  content: |
    <div id="updates" style="margin-top: 150px; text-align: center;">
      <h2 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">UPDATE</h2>
      <p>2024.05.08 Portfolio Site Open</p>
    </div>

    <div id="work" style="margin-top: 150px; text-align: center;">
      <h2 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">WORK</h2>
      <p>(ここに作品のリストやスライドを後ほど追加します)</p>
    </div>

    <div id="about" style="margin-top: 150px; text-align: center;">
      <h2 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">ABOUT</h2>
      <p>Your self-introduction goes here.</p>
    </div>

    <div id="contact" style="margin-top: 150px; text-align: center;">
      <h2 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">CONTACT</h2>
      <p>Mail: your-email@example.com</p>
    </div>

# HTMLタグを直接書けるようにする許可設定
markup:
  goldmark:
    renderer:
      unsafe: true