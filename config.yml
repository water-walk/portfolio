baseURL: "https://water-walk.github.io/portfolio/"
title: "Hasuda | Portfolio"
theme: ["hugo-PaperMod"]

enableEmoji: true
minify:
  disableXML: true
  minifyOutput: true

# 言語設定
languages:
  en:
    languageName: "JP"
    weight: 1
    menu:
      main:
        - name: "UPDATE"
          url: "#updates"
          weight: 10
        - name: "WORK"
          url: "#work"
          weight: 20
        - name: "ABOUT"
          url: "#about"
          weight: 30
        - name: "CONTACT"
          url: "#contact"
          weight: 40

# 設定
params:
  env: production
  description: "Hasuda's portfolio"
  author: "Mizuho Hasuda"

  # 見た目
  defaultTheme: light      # 背景
  disableThemeToggle: true # ダークモード切替を隠す
  
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true

  # トップ画面
  profileMode:
    enabled: true
    title: "Hasuda's portfolio"
    subtitle: "oooo"
    imageWidth: 200
    imageHeight: 200
    buttons:
      - name: "View Works"
        url: "#work"

  # SNSアイコン
  socialIcons:
    - name: github
      url: "https://github.com/water-walk"

  content: |
    <div id="about" style="margin-top: 150px; text-align: center; max-width: 700px; margin-left: auto; margin-right: auto; font-family: 'Helvetica Neue', Arial, sans-serif;">
      <h2 style="margin-bottom: 50px; font-weight: 300; letter-spacing: 4px;">ABOUT</h2>
      <div style="text-align: left; padding: 0 20px;">
        <style>
          .about-row { display: flex; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
          .about-label { width: 120px; font-weight: bold; color: #888; font-size: 0.9rem; letter-spacing: 1px; }
          .about-content { flex: 1; color: #333; line-height: 1.6; }
        </style>
        <div class="about-row">
          <div class="about-label">NAME</div>
          <div class="about-content">蓮田 瑞歩 / Mizuho Hasuda</div>
        </div>
        <div class="about-row">
          <div class="about-label">BIO</div>
          <div class="about-content">
            ここに自己紹介文を入力します。Kishinoさんのように、現在の所属や活動拠点、専門領域などを1〜2文で簡潔に書くと雰囲気が近づきます。
          </div>
        </div>
        <div class="about-row">
          <div class="about-label">SKILLS</div>
          <div class="about-content">C++, Python, Unity, OpenFrameworks, Digital Fabrication</div>
        </div>
        <div class="about-row">
          <div class="about-label">LINKS</div>
          <div class="about-content">
            <a href="https://github.com/water-walk" style="color: #000; text-decoration: none; border-bottom: 1px solid #000; margin-right: 15px;">GitHub</a>
            <a href="https://x.com/your_id" style="color: #000; text-decoration: none; border-bottom: 1px solid #000;">X (Twitter)</a>
          </div>
        </div>
      </div>
    </div>

# HTMLタグを直接書けるようにする許可設定
markup:
  goldmark:
    renderer:
      unsafe: true