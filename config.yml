baseURL: "https://water-walk.github.io/portfolio/"
title: "Hasuda | Portfolio"
theme: ["hugo-PaperMod"]

enableEmoji: true
minify:
  disableXML: true
  minifyOutput: true

# 設定
params:
  env: production
  description: "Hasuda's portfolio"
  author: "Mizuho Hasuda"

  # 見た目（白背景・ダークモード切替なし）
  defaultTheme: light
  disableThemeToggle: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true

  # 【重要】通常の記事リストを隠し、profileModeのカスタムレイアウトだけを表示させます
  profileMode:
    enabled: true

  # SNSアイコン（フッター用）
  socialIcons:
    - name: github
      url: "https://github.com/water-walk"

# 手書き案に合わせたナビゲーションメニュー
languages:
  en:
    languageName: "JP"
    weight: 1
    menu:
      main:
        - name: "WORK"
          url: "#work"
          weight: 10
        - name: "PROFILE"
          url: "#profile"
          weight: 20
        - name: "PUBLICATION"
          url: "#publication"
          weight: 30
        - name: "CONTACT"
          url: "#contact"
          weight: 40
    
    # 独自のポートフォリオレイアウト
    params:
      profileMode:
        content: |
          <!-- 1. メインビジュアル（Nattsu.jpgを表示） -->
          <div style="width: 100vw; margin-left: calc(-50vw + 50%); margin-top: -30px; margin-bottom: 80px; overflow: hidden;">
            <img src="./Nattsu.jpg" alt="Nattsu" style="width: 100%; height: auto; display: block; max-height: 70vh; object-fit: cover;">
          </div>

          <!-- 全体の幅を整えるコンテナ -->
          <div style="max-width: 900px; margin: 0 auto; padding: 0 20px; font-family: 'Helvetica Neue', Arial, sans-serif;">
            
            <!-- 2. WORK (制作実績) -->
            <div id="work" style="margin-bottom: 120px; text-align: left;">
              <h2 style="font-size: 1.8rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid #111; padding-bottom: 5px;">WORK</h2>
              <p style="font-size: 0.9rem; color: #666; margin-bottom: 30px;">制作実績</p>
              
              <!-- 横並びのカードレイアウト -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;">
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 4px; background: #fff;">
                  <div style="aspect-ratio: 4/3; background: #eee; margin-bottom: 10px; border-radius: 2px;"></div>
                  <h3 style="font-size: 1rem; margin-bottom: 5px;">Work 01</h3>
                  <p style="font-size: 0.8rem; color: #666;">作品の説明がここに入ります。</p>
                </div>
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 4px; background: #fff;">
                  <div style="aspect-ratio: 4/3; background: #eee; margin-bottom: 10px; border-radius: 2px;"></div>
                  <h3 style="font-size: 1rem; margin-bottom: 5px;">Work 02</h3>
                  <p style="font-size: 0.8rem; color: #666;">作品の説明がここに入ります。</p>
                </div>
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 4px; background: #fff;">
                  <div style="aspect-ratio: 4/3; background: #eee; margin-bottom: 10px; border-radius: 2px;"></div>
                  <h3 style="font-size: 1rem; margin-bottom: 5px;">Work 03</h3>
                  <p style="font-size: 0.8rem; color: #666;">作品の説明がここに入ります。</p>
                </div>
              </div>
            </div>

            <!-- 3. PROFILE -->
            <div id="profile" style="margin-bottom: 120px; text-align: left;">
              <h2 style="font-size: 1.8rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; border-bottom: 1px solid #111; padding-bottom: 5px;">PROFILE</h2>
              
              <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">
                <div style="width: 150px; height: 150px; background: #eee; border-radius: 4px; flex-shrink: 0;"></div>
                <div style="flex: 1; min-width: 280px; line-height: 1.8;">
                  <p style="font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">蓮田 瑞穂 / Mizuho Hasuda</p>
                  <p style="color: #444; font-size: 0.95rem;">ここにプロフィールテキストを入力します。</p>
                </div>
              </div>
            </div>

            <!-- 4. PUBLICATION -->
            <div id="publication" style="margin-bottom: 120px; text-align: left;">
              <h2 style="font-size: 1.8rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; border-bottom: 1px solid #111; padding-bottom: 5px;">PUBLICATION</h2>
              <p style="font-size: 0.95rem; color: #444;">学会発表や展示などの実績をここに記載します。</p>
            </div>

            <!-- 5. CONTACT -->
            <div id="contact" style="margin-bottom: 100px; text-align: left;">
              <h2 style="font-size: 1.8rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; border-bottom: 1px solid #111; padding-bottom: 5px;">CONTACT</h2>
              <p style="font-size: 0.95rem; color: #444;">
                お問い合わせは以下までお願いいたします。<br>
                Email: <a href="mailto:your-email@example.com" style="color: #000; text-decoration: underline;">your-email@example.com</a>
              </p>
            </div>
          </div>

# HTMLを埋め込むための許可設定
markup:
  goldmark:
    renderer:
      unsafe: true